name: docs-check

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pattern-guards:
    name: Pattern guards (epic convention, doc counts, version pins, reading time, done rule)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Old epic-folder convention must not appear
        run: |
          hits=$(grep -rEn 'backlog/epics/(NN|<NN>)-' \
                   --include='*.md' \
                   --exclude=CHANGELOG.md \
                   --exclude-dir=evaluations \
                   --exclude-dir=.git \
                 || true)
          if [ -n "$hits" ]; then
            echo "::error::Old epic-folder convention found:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no stale epic-folder references."

      - name: Doc count claims must not say 11 or "Twelve"
        run: |
          hits=$(grep -rEn '(\b11 docs covering|Twelve short docs|all 12 methodology docs)' \
                   --include='*.md' \
                   --exclude=CHANGELOG.md \
                   --exclude-dir=evaluations \
                   --exclude-dir=.git \
                 || true)
          if [ -n "$hits" ]; then
            echo "::error::Stale doc-count claim found:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no stale doc-count claims."

      - name: Stale reading-time claim
        run: |
          hits=$(grep -rEn 'Read in 90 minutes' \
                   --include='*.md' \
                   --exclude=CHANGELOG.md \
                   --exclude-dir=evaluations \
                   --exclude-dir=.git \
                 || true)
          if [ -n "$hits" ]; then
            echo "::error::Stale 'Read in 90 minutes' claim:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no stale reading-time claim."

      - name: Status:done rule must not say "No exceptions"
        run: |
          hits=$(grep -rEnB1 -A1 'Status: done.*requires.*Test: pass' \
                   --include='*.md' \
                   --exclude=CHANGELOG.md \
                   --exclude-dir=evaluations \
                   --exclude-dir=.git \
                 | grep -i 'no exceptions' \
                 || true)
          if [ -n "$hits" ]; then
            echo "::error::Stale 'No exceptions' near Status:done rule:"
            echo "$hits"
            exit 1
          fi
          echo "OK — Status:done rule consistent (extended form everywhere)."

      - name: Version pin consistency
        run: |
          current=$(grep -oE 'Currently \[v1\.[0-9]+\.[0-9]+\]' README.md | head -1 | grep -oE 'v1\.[0-9]+\.[0-9]+')
          if [ -z "$current" ]; then
            echo "::error::Could not detect current version from README.md 'Currently [vX.Y.Z]' line."
            exit 1
          fi
          echo "Detected current version: $current"
          pins=$(grep -rEn '(Pinned-against|Pinned to|Built against methodology) [* ]*v1\.[0-9]+\.[0-9]+' \
                   --include='*.md' \
                   --exclude=CHANGELOG.md \
                   --exclude-dir=evaluations \
                   --exclude-dir=.git \
                 | grep -v "$current" \
                 || true)
          if [ -n "$pins" ]; then
            echo "::error::Stale version pins (must match $current):"
            echo "$pins"
            exit 1
          fi
          echo "OK — all explicit version pins match $current."

  link-check:
    name: Internal markdown link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check internal markdown links (Python; no external action deps)
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          from urllib.parse import unquote

          # Match standard markdown links: [text](path)
          LINK_RE = re.compile(r'(?<!\!)\[([^\]]+)\]\(([^)]+)\)')
          # Skip external links + anchors-only + mailto.
          EXTERNAL_PREFIXES = ('http://', 'https://', 'mailto:', '#')
          # Folders excluded from the scan.
          EXCLUDE_DIRS = {'.git', 'evaluations', 'distribution'}

          repo = Path('.').resolve()
          broken = []
          checked = 0

          for md in repo.rglob('*.md'):
              if any(part in EXCLUDE_DIRS for part in md.parts):
                  continue
              if md.name == 'CHANGELOG.md':
                  continue
              try:
                  text = md.read_text(encoding='utf-8')
              except Exception as e:
                  print(f"WARN reading {md}: {e}")
                  continue
              for m in LINK_RE.finditer(text):
                  link = m.group(2).strip()
                  # Strip anchor + query.
                  link_path = unquote(link.split('#', 1)[0].split('?', 1)[0])
                  if not link_path:
                      continue  # anchor-only
                  if link.startswith(EXTERNAL_PREFIXES):
                      continue
                  checked += 1
                  # Resolve relative to the file's directory.
                  resolved = (md.parent / link_path).resolve()
                  if not resolved.exists():
                      broken.append((md.relative_to(repo), link, str(resolved.relative_to(repo) if resolved.is_relative_to(repo) else resolved)))

          print(f"Checked {checked} internal links across markdown files.")
          if broken:
              print(f"::error::{len(broken)} broken internal links:")
              for src, link, resolved in broken:
                  print(f"  {src}: [...]({link})  →  resolves to {resolved} (NOT FOUND)")
              sys.exit(1)
          print("OK — all internal markdown links resolve.")
          PY
