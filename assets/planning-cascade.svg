<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">From brief to backlog item</title><desc id="desc">A project brief informs strategy, pillars, epics and items. Optional design planning feeds an epic. Each item carries the approved goal, plan and verification steps.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#0f172a"><rect x="40" y="50" width="800" height="110" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="60" y="84" font-size="24" font-weight="700">Project brief</text><text x="60" y="114" font-size="18">Product, audience, problem, success metrics, competition,</text><text x="60" y="140" font-size="18">business viability, technology, and capability layers</text><path d="M440 165 L440 212" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="220" width="800" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="60" y="254" font-size="24" font-weight="700">Strategy</text><text x="60" y="284" font-size="18">Vision, versioned phases, and exit criteria</text><text x="60" y="310" font-size="18">docs/strategy/</text><path d="M440 335 L440 382" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="390" width="800" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="60" y="424" font-size="24" font-weight="700">Pillars</text><text x="60" y="454" font-size="18">Evergreen capability goals</text><text x="60" y="480" font-size="18">docs/pillars/</text><path d="M440 505 L440 552" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="560" width="800" height="150" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="60" y="594" font-size="24" font-weight="700">Epics</text><text x="60" y="624" font-size="18">Bounded outcomes with acceptance criteria</text><text x="60" y="650" font-size="18">README.md · BACKLOG.md · ARCHIVE.md</text><text x="60" y="676" font-size="18">FUTURE.md · TEST.md</text><path d="M440 715 L440 802" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="810" width="800" height="150" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="60" y="844" font-size="24" font-weight="700">Items</text><text x="60" y="874" font-size="18">Approved goal, plan, Code Map where required, and verification</text><text x="60" y="900" font-size="18">Priority · effort · status · test evidence · lock</text><text x="60" y="926" font-size="18">Sized for a contributor; one shared backlog format</text><rect x="880" y="390" width="280" height="140" rx="12" fill="#ede9fe" stroke="#94a3b8"/><text x="900" y="424" font-size="24" font-weight="700">Optional planning</text><text x="900" y="454" font-size="18">Pre-epic design work</text><text x="900" y="480" font-size="18">docs/planning/</text><path d="M845 445 L873 445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M1020 535 L1020 635 L850 635" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="1010" font-size="22">The brief supplies direction; each downstream artifact makes that direction actionable.</text></g></svg>
