<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">How the methodology fits together</title><desc id="desc">Four planning layers flow from strategy to items. Working principles, Definition of Done and memory bind the work. Locks, Git workflow and verification support it.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#0f172a"><text x="35" y="50" font-size="30" font-weight="700">Planning</text><text x="435" y="50" font-size="30" font-weight="700">Disciplines</text><text x="835" y="50" font-size="30" font-weight="700">Operational supports</text><rect x="35" y="90" width="330" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="55" y="124" font-size="24" font-weight="700">Strategy</text><text x="55" y="154" font-size="18">Why and for whom</text><path d="M200 192 L200 217" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="220" width="330" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="55" y="254" font-size="24" font-weight="700">Pillars</text><text x="55" y="284" font-size="18">Long-term capabilities</text><path d="M200 322 L200 347" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="350" width="330" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="55" y="384" font-size="24" font-weight="700">Epics</text><text x="55" y="414" font-size="18">Bounded delivery outcomes</text><path d="M200 452 L200 477" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="480" width="330" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="55" y="514" font-size="24" font-weight="700">Items</text><text x="55" y="544" font-size="18">Concrete units of work</text><rect x="435" y="90" width="330" height="130" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="455" y="124" font-size="24" font-weight="700">Working principles</text><text x="455" y="154" font-size="18">Keep decisions and changes focused</text><rect x="435" y="260" width="330" height="130" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="455" y="294" font-size="24" font-weight="700">Definition of Done</text><text x="455" y="324" font-size="18">Require evidence before completion</text><rect x="435" y="430" width="330" height="130" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="455" y="464" font-size="24" font-weight="700">Memory</text><text x="455" y="494" font-size="18">Carry lessons into future sessions</text><rect x="835" y="90" width="330" height="130" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="855" y="124" font-size="24" font-weight="700">Locks</text><text x="855" y="154" font-size="18">Coordinate parallel contributors</text><rect x="835" y="260" width="330" height="130" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="855" y="294" font-size="24" font-weight="700">Git workflow</text><text x="855" y="324" font-size="18">Preserve review and history</text><rect x="835" y="430" width="330" height="130" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="855" y="464" font-size="24" font-weight="700">Fix-test loop</text><text x="855" y="494" font-size="18">Verify behavior in the actual UI</text><path d="M373 305 L425 305" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M773 305 L825 305" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="635" font-size="21">Every unit of work follows the disciplines and uses the operational supports.</text></g></svg>
