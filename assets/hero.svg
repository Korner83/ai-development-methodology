<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="AI Development Methodology — process for teams where some contributors are AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="320" fill="#3b82f6"/>

  <text x="64" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">AI Development Methodology</text>
  <text x="64" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">Run a software project when some of your contributors are AI agents.</text>
  <text x="64" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">Markdown + git · no SaaS · no vendor lock-in · CC BY 4.0</text>

  <!-- planning layers -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="64"  y="232" width="150" height="48" rx="10" fill="#1e3a8a"/>
    <text x="139" y="262" fill="#dbeafe" text-anchor="middle">Strategy</text>
    <rect x="238" y="232" width="150" height="48" rx="10" fill="#1d4ed8"/>
    <text x="313" y="262" fill="#dbeafe" text-anchor="middle">Pillars</text>
    <rect x="412" y="232" width="150" height="48" rx="10" fill="#2563eb"/>
    <text x="487" y="262" fill="#dbeafe" text-anchor="middle">Epics</text>
    <rect x="586" y="232" width="150" height="48" rx="10" fill="#3b82f6"/>
    <text x="661" y="262" fill="#eff6ff" text-anchor="middle">Items</text>
  </g>

  <!-- overlays -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="788" y="232" width="166" height="48" rx="10" fill="#78350f"/>
    <text x="871" y="261" fill="#fef3c7" text-anchor="middle">Disciplines</text>
    <rect x="978" y="232" width="158" height="48" rx="10" fill="#14532d"/>
    <text x="1057" y="261" fill="#dcfce7" text-anchor="middle">Verification</text>
  </g>
</svg>
